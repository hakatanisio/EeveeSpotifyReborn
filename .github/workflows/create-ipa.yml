# .github/workflows/build_ipa.yml

name: Create EeveeSpotifyReborn IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted Spotify IPA file"
        required: true
        type: string
        
      tweak_version:
        description: "The version of EeveeSpotify to use. (e.g., 6.1.2)"
        default: "6.1.2"
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "Spotify"
        required: false
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.spotify.client"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EeveeSpotifyReborn IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name

      - name: Download and validate IPA
        run: |
          wget -q -O ${{ github.workspace }}/spotify.ipa "${{ inputs.ipa_url }}"
          
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Install Dependencies
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download EeveeSpotifyReborn Debs
        id: download_debs
        run: |
          # Construct the download URLs directly using the user-provided version.
          # This avoids all API-related issues.
          TAG="swift${{ inputs.tweak_version }}"
          
          EEVEE_DEB_URL="https://github.com/whoeevee/EeveeSpotifyReborn/releases/download/$TAG/com.eevee.spotify_${{ inputs.tweak_version }}_iphoneos-arm64.deb"
          
          # The protobuf version seems to be independent. We'll hardcode the known compatible version.
          # If this changes in future releases, this URL will need to be updated.
          PROTOBUF_DEB_URL="https://github.com/whoeevee/EeveeSpotifyReborn/releases/download/$TAG/org.swift.protobuf.swiftprotobuf_1.29.0_iphoneos-arm64.deb"

          echo "Downloading Tweak from $EEVEE_DEB_URL"
          wget -q --spider "$EEVEE_DEB_URL" || (echo "::error::EeveeSpotify .deb URL is not valid. Check the version number." && exit 1)
          wget -q "$EEVEE_DEB_URL" -O eevee.deb
          
          echo "Downloading Dependency from $PROTOBUF_DEB_URL"
          wget -q --spider "$PROTOBUF_DEB_URL" || (echo "::error::Protobuf .deb URL is not valid. The dependency might have changed." && exit 1)
          wget -q "$PROTOBUF_DEB_URL" -O protobuf.deb

      - name: Inject tweaks into IPA
        id: inject
        run: |
          output_ipa_name="EeveeSpotifyReborn_${{ inputs.tweak_version }}.ipa"
          
          cyan -i spotify.ipa -o "$output_ipa_name" -uwef eevee.deb protobuf.deb -n "${{ inputs.display_name }}" -b "${{ inputs.bundle_id }}"
          
          echo "output_name=${output_ipa_name}" >> $GITHUB_OUTPUT

      - name: Upload IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: esp-${{ github.run_number }}
          name: EeveeSpotifyReborn v${{ inputs.tweak_version }} (${{ github.run_number }})
          files: ${{ steps.inject.outputs.output_name }}
          draft: false
          
      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
