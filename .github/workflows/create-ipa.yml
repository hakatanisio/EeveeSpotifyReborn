# .github/workflows/build_ipa.yml

name: Create EeveeSpotifyReborn IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted Spotify IPA file"
        required: true
        type: string
        
      tweak_version:
        description: "The version of EeveeSpotify to use. Get from Releases page."
        default: "6.1.2" # You can change this default to the latest version
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "Spotify"
        required: false
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.spotify.client"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EeveeSpotifyReborn IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Hide sensitive IPA URL
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,tweak_version

      - name: Download and validate IPA
        run: |
          wget -q "${{ inputs.ipa_url }}" -O ${{ github.workspace }}/spotify.ipa
          
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Install IPA Patcher (pyzule-rw)
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download EeveeSpotifyReborn Debs
        run: |
          # Download EeveeSpotifyReborn Tweak
          wget -q "https://github.com/whoeevee/EeveeSpotifyReborn/releases/download/${{ inputs.tweak_version }}/com.eevee.spotify_${{ inputs.tweak_version }}_iphoneos-arm64.deb" -O eevee.deb

          
          # Download Swift Protobuf dependency
          # Note: The version of this dependency might not always match the tweak version.
          # We will assume it's available on the same release page for simplicity.
          # You may need to adjust this if the developer packages it differently in the future.
          protobuf_version=$(curl -s "https://api.github.com/repos/whoeevee/EeveeSpotifyReborn/releases/tags/${{ inputs.tweak_version }}" | grep "org.swift.protobuf" | grep "browser_download_url" | head -n 1 | cut -d '"' -f 4 | cut -d'_' -f 2)
          if [ -z "$protobuf_version" ]; then
             echo "::warning::Could not dynamically find protobuf version, falling back to tweak version."
             protobuf_version="${{ inputs.tweak_version }}"
          fi
          wget -q "https://github.com/whoeevee/EeveeSpotifyReborn/releases/download/${{ inputs.tweak_version }}/org.swift.protobuf.swiftprotobuf_${protobuf_version}_iphoneos-arm64.deb" -O protobuf.deb


      - name: Inject tweaks into IPA
        id: inject
        run: |
          output_ipa_name="EeveeSpotifyReborn_${{ inputs.tweak_version }}.ipa"
          
          cyan -i spotify.ipa -o "$output_ipa_name" -uwef eevee.deb protobuf.deb -n "${{ inputs.display_name }}" -b "${{ inputs.bundle_id }}"
          
          echo "output_name=${output_ipa_name}" >> $GITHUB_OUTPUT

      - name: Upload IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: esp-${{ github.run_number }}
          name: EeveeSpotifyReborn v${{ inputs.tweak_version }} (${{ github.run_number }})
          files: ${{ steps.inject.outputs.output_name }}
          draft: false
          
      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
